<!doctype html>
<html lang="es-ES">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>vpmadrid</title>
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header id="barra-superior"></header>

  <div id="contador-sets">
    <span id="sets-izquierda">0</span> - <span id="sets-derecha">0</span>
  </div>

  <main id="campo">
    <section class="mitad" id="mitad-izquierda">
      <div class="nombre-equipo"></div>
      <div class="numero-puntos">0</div>
    </section>
    <section class="mitad" id="mitad-derecha">
      <div class="nombre-equipo"></div>
      <div class="numero-puntos">0</div>
    </section>
  </main>

  <dialog id="dialogo-fin">
    <h2></h2>
    <p></p>
    <form method="dialog">
      <button>Aceptar</button>
    </form>
  </dialog>
</body>
</html>
